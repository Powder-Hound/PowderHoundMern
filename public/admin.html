<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PowAlert CRM v2</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1419;
        --panel: #1a222c;
        --line: #2b3644;
        --text: #e8eef5;
        --muted: #93a1b1;
        --accent: #4cc2ff;
        --danger: #ff7b7b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header, main { max-width: 1280px; margin: 0 auto; padding: 20px; }
      h1 { margin: 0 0 6px; font-size: 22px; }
      p.sub { margin: 0 0 18px; color: var(--muted); }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 16px;
      }
      label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
      input, select, button {
        font: inherit;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #0f1419;
        color: var(--text);
      }
      button {
        background: var(--accent);
        color: #041018;
        border: 0;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary { background: #2b3644; color: var(--text); }
      .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
      .row > * { min-width: 140px; }
      .row .wide { min-width: 220px; flex: 1; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { color: var(--muted); font-weight: 600; }
      .err { color: var(--danger); }
      .ok { color: #7dffb3; }
      .hidden { display: none; }
      .meta { color: var(--muted); font-size: 13px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
      .chip {
        font-size: 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 10px;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>PowAlert CRM v2</h1>
      <p class="sub">Phase A segments. Read-only — no campaign send. Admin allow-list required. HOLD-MERGE until CoS reviews.</p>
    </header>
    <main>
      <section id="login-panel" class="panel">
        <p class="meta">Sign in with the existing phone login, then the live admin allow-list is checked.</p>
        <div class="row">
          <div>
            <label for="phone">Admin phone</label>
            <input id="phone" inputmode="tel" placeholder="17205550100" />
          </div>
          <button id="login-btn" type="button">Open CRM</button>
        </div>
        <p id="login-msg" class="meta"></p>
      </section>

      <section id="crm-panel" class="panel hidden">
        <div class="row">
          <div class="wide">
            <label for="q">Search name / phone / email</label>
            <input id="q" />
          </div>
          <div>
            <label for="pass">Pass</label>
            <select id="pass">
              <option value="">Any</option>
              <option>Epic</option>
              <option>Ikon</option>
              <option>Indy</option>
              <option>MountainCollective</option>
            </select>
          </div>
          <div class="wide">
            <label for="followsResort">Follows resort (id or slug)</label>
            <input id="followsResort" list="resort-slugs" placeholder="copper-mountain or ObjectId" />
            <datalist id="resort-slugs"></datalist>
          </div>
          <div>
            <label for="emailMarketingConsent">Email marketing consent</label>
            <select id="emailMarketingConsent">
              <option value="">Any</option>
              <option value="true">Consented</option>
              <option value="false">Not consented</option>
            </select>
          </div>
          <div>
            <label for="hasEmail">Has email</label>
            <select id="hasEmail">
              <option value="">Any</option>
              <option value="true">Non-empty email</option>
              <option value="false">No email</option>
            </select>
          </div>
          <div>
            <label for="contest">Contest</label>
            <select id="contest">
              <option value="">Any</option>
              <option value="true">Entered</option>
              <option value="false">Not entered</option>
            </select>
          </div>
          <div>
            <label for="ig">Instagram</label>
            <select id="ig">
              <option value="">Any</option>
              <option value="true">Has IG</option>
              <option value="false">No IG</option>
            </select>
          </div>
          <button id="search-btn" type="button">Filter</button>
          <button id="csv-btn" class="secondary" type="button">Download CSV</button>
        </div>
        <p id="crm-msg" class="meta"></p>
        <div id="applied" class="chips"></div>
        <div style="overflow:auto">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Consent</th>
                <th>Passes</th>
                <th>Hills</th>
                <th>Stick</th>
                <th>Created</th>
                <th>Verified</th>
                <th>Contest</th>
                <th>IG</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script>
      const tokenKey = "powalert_admin_token";
      const loginPanel = document.getElementById("login-panel");
      const crmPanel = document.getElementById("crm-panel");
      const loginMsg = document.getElementById("login-msg");
      const crmMsg = document.getElementById("crm-msg");
      const filterIds = [
        "q",
        "pass",
        "followsResort",
        "contest",
        "ig",
        "emailMarketingConsent",
        "hasEmail",
      ];

      const toSlug = (name) =>
        String(name || "")
          .trim()
          .toLowerCase()
          .replace(/['’]/g, "")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");

      const queryString = () => {
        const params = new URLSearchParams();
        for (const id of filterIds) {
          const value = document.getElementById(id).value.trim();
          if (value) params.set(id, value);
        }
        return params.toString();
      };

      const headers = () => ({
        Authorization: "Bearer " + localStorage.getItem(tokenKey),
        "Content-Type": "application/json",
      });

      async function confirmAdmin() {
        const res = await fetch("/api/admin/me", { headers: headers() });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(body.message || "Admin access denied");
        }
        return body;
      }

      async function loadResortSlugs() {
        try {
          const res = await fetch("/api/resorts/harvest");
          const body = await res.json().catch(() => ({}));
          const list = document.getElementById("resort-slugs");
          list.innerHTML = "";
          for (const resort of body.data || []) {
            const slug = toSlug(resort.resortName);
            const option = document.createElement("option");
            option.value = slug;
            option.label = resort.resortName || slug;
            list.appendChild(option);
          }
        } catch {
          // Harvest is optional; ObjectId / typed slug still work.
        }
      }

      function renderApplied(applied) {
        const box = document.getElementById("applied");
        box.innerHTML = "";
        for (const item of applied || []) {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = `${item.id}=${item.value}`;
          box.appendChild(chip);
        }
      }

      async function loadRows() {
        const qs = queryString();
        const res = await fetch("/api/admin/users" + (qs ? "?" + qs : ""), {
          headers: headers(),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(body.message || "Could not load users");
        }
        const tbody = document.getElementById("rows");
        tbody.innerHTML = "";
        for (const row of body.rows || []) {
          const tr = document.createElement("tr");
          const stick = row.stick
            ? `${row.stick.preferredResorts ?? ""}/${row.stick.anyResort ?? ""} ${row.stick.uom || ""}`.trim()
            : "";
          const cells = [
            row.name,
            row.phone,
            row.email,
            row.emailMarketingConsent ? "yes" : "no",
            (row.passes || []).join(", "),
            (row.followedResorts || []).length,
            stick,
            row.createdAt ? new Date(row.createdAt).toLocaleDateString() : "",
            row.verifiedProxy ? "SID" : "",
            row.contestStatus,
            row.instagramHandle,
          ];
          for (const value of cells) {
            const td = document.createElement("td");
            td.textContent = value ?? "";
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }
        const applied = (body.applied || [])
          .map((item) => `${item.id}=${item.value}`)
          .join(", ");
        crmMsg.className = "meta";
        crmMsg.textContent = `${body.count} shown / ${body.total} total. Read-only.${
          applied ? " Segments: " + applied + "." : ""
        }`;
        renderApplied(body.applied);
      }

      async function openCrm() {
        await confirmAdmin();
        loginPanel.classList.add("hidden");
        crmPanel.classList.remove("hidden");
        await Promise.all([loadResortSlugs(), loadRows()]);
      }

      document.getElementById("login-btn").addEventListener("click", async () => {
        loginMsg.textContent = "";
        try {
          const phone = document.getElementById("phone").value.trim();
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phoneNumber: phone }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok || !body.token) {
            throw new Error(body.message || "Login failed");
          }
          localStorage.setItem(tokenKey, body.token);
          await openCrm();
        } catch (error) {
          loginMsg.className = "err";
          loginMsg.textContent = error.message;
        }
      });

      document.getElementById("search-btn").addEventListener("click", async () => {
        crmMsg.textContent = "";
        try {
          await loadRows();
        } catch (error) {
          crmMsg.className = "err";
          crmMsg.textContent = error.message;
        }
      });

      document.getElementById("csv-btn").addEventListener("click", async () => {
        try {
          const qs = queryString();
          const res = await fetch("/api/admin/users.csv" + (qs ? "?" + qs : ""), {
            headers: headers(),
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            throw new Error(body.message || "CSV export failed");
          }
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "powalert-crm-users.csv";
          a.click();
          URL.revokeObjectURL(url);
        } catch (error) {
          crmMsg.className = "err";
          crmMsg.textContent = error.message;
        }
      });

      if (localStorage.getItem(tokenKey)) {
        openCrm().catch(() => {
          localStorage.removeItem(tokenKey);
        });
      }
    </script>
  </body>
</html>
